services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3002:3000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/images
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    develop:
      watch:
        - path: .
          action: rebuild
          target: /app
          ignore:
            - ./.git

  database:
    image: postgres:13.14-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - 9010:9000
      - 9011:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_REGION=eu-north-1
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - minio:/data

volumes:
  database:
    driver: local
  minio:
    driver: local
