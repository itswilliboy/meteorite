services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3003:3000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    develop:
      watch:
        - path: .
          action: rebuild
          target: /app
          ignore:
            - ./.git

  database:
    image: postgres:13.14-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
    driver: local
